name: Safe-Settings Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Sync
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ADMIN_REPO: ".github"
          CONFIG_PATH: "safe-settings"
        run: |
          rm -rf /tmp/safe-settings-tool
          git clone --branch 2.1.18 https://github.com/github/safe-settings.git /tmp/safe-settings-tool
          cd /tmp/safe-settings-tool
          npm ci
          npm run full-sync
