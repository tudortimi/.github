name: Safe-Settings Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Sync
        env:
          APP_ID: ${{ secrets.APP_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ADMIN_REPO: ".github"
          CONFIG_PATH: "safe-settings"
        run: |
          git clone https://github.com tool-dir
          cd tool-dir && npm ci && npm run build && npm run full-sync
