name: sync-repo-settings

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  sync-repo-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        owner: ["tudortimi", "svunit"]
    steps:
      - uses: actions/checkout@v7.0.1
      
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
      
      - name: Update Repository Settings
        uses: joshjohanning/bulk-github-repo-settings-sync-action@v2.12.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          owner: ${{ matrix.owner }}
          repositories: all
          delete-branch-on-merge: true
          allow-merge-commit: true
          allow-squash-merge: false
          allow-rebase-merge: false
          wiki: false
          rulesets-file: |
            ./config/rulesets/tag-protection.json
            ./config/rulesets/branch-protection.json
            ./config/rulesets/branch-protection-no-bypass.json

  build:
    if: always()
    needs: sync-repo-settings
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all repository sync jobs to pass
        env:
          SYNC_RESULT: ${{ needs.sync-repo-settings.result }}
        run: |
          if [[ "$SYNC_RESULT" != "success" ]]; then
            echo "Repository settings sync did not succeed: $SYNC_RESULT"
            exit 1
          fi
