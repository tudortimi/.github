name: sync-repo-settings

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  sync-repo-settings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: "tudortimi"
      
      - name: Fetch All User Repositories
        id: get-repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPOS=$(gh repo list tudortimi --limit 1000 --json nameWithOwner -q '[.[].nameWithOwner] | join(",")')
          echo "Discovered repositories: $REPOS"
          echo "repo_list=$REPOS" >> $GITHUB_OUTPUT
      
      - name: Update Repository Settings
        uses: joshjohanning/bulk-github-repo-settings-sync-action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          repositories: ${{ steps.get-repos.outputs.repo_list }}
          repositories-file: ./config/settings-config.yml

